<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>沙漠突袭 · Dust Strike</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23f0b64a' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='8' r='1.6' fill='%23f0b64a'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --amber: #f0b64a;
        --green: #46ff7d;
        --panel: rgba(8, 12, 10, 0.62);
        --panel-border: rgba(240, 182, 74, 0.35);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0c0a;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        color: #e8e6dc;
      }
      #game {
        position: absolute;
        inset: 0;
        cursor: crosshair;
      }
      #game canvas {
        display: block;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }

      /* ---------- 准星 ---------- */
      #crosshair {
        --gap: 6px;
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
      }
      #crosshair .line {
        position: absolute;
        background: var(--green);
        box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
      }
      #crosshair .t {
        width: 2px;
        height: 8px;
        left: -1px;
        top: calc(-8px - var(--gap));
      }
      #crosshair .b {
        width: 2px;
        height: 8px;
        left: -1px;
        top: var(--gap);
      }
      #crosshair .l {
        width: 8px;
        height: 2px;
        top: -1px;
        left: calc(-8px - var(--gap));
      }
      #crosshair .r {
        width: 8px;
        height: 2px;
        top: -1px;
        left: var(--gap);
      }
      #crosshair .dot {
        position: absolute;
        width: 2px;
        height: 2px;
        left: -1px;
        top: -1px;
        background: var(--green);
      }

      /* ---------- 命中反馈 ---------- */
      #hitmarker {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        opacity: 0;
        transition: opacity 0.05s;
      }
      #hitmarker.show {
        opacity: 1;
      }
      #hitmarker span {
        position: absolute;
        width: 2px;
        height: 9px;
        background: #fff;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      }
      #hitmarker.head span {
        background: #ff4b3c;
      }
      #hitmarker span:nth-child(1) {
        transform: translate(-7px, -12px) rotate(-45deg);
      }
      #hitmarker span:nth-child(2) {
        transform: translate(5px, -12px) rotate(45deg);
      }
      #hitmarker span:nth-child(3) {
        transform: translate(-7px, 3px) rotate(45deg);
      }
      #hitmarker span:nth-child(4) {
        transform: translate(5px, 3px) rotate(-45deg);
      }

      /* ---------- 受击红屏 ---------- */
      #damage-vignette {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse at center, rgba(200, 0, 0, 0) 42%, rgba(190, 10, 10, 0.55) 100%);
      }

      /* ---------- 狙击镜 ---------- */
      #scope {
        position: absolute;
        inset: 0;
        display: none;
      }
      #scope.show {
        display: block;
      }
      #scope .mask {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0) 31%,
          rgba(0, 0, 0, 0.97) 33%,
          #000 100%
        );
      }
      #scope .lineh,
      #scope .linev {
        position: absolute;
        background: rgba(0, 0, 0, 0.9);
      }
      #scope .lineh {
        left: 0;
        right: 0;
        top: 50%;
        height: 1.5px;
      }
      #scope .linev {
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1.5px;
      }

      /* ---------- 顶部 ---------- */
      #topbar {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: stretch;
        gap: 2px;
        text-align: center;
        font-weight: 700;
      }
      #topbar .cell {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        padding: 6px 14px;
        min-width: 56px;
      }
      #score-ct {
        color: #57d8ff;
        font-size: 22px;
      }
      #score-t {
        color: #ff5140;
        font-size: 22px;
      }
      #topbar .mid {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 110px;
      }
      #round-timer {
        font-size: 20px;
        color: var(--amber);
      }
      #round-timer.low {
        color: #ff5140;
      }
      #round-num {
        font-size: 11px;
        opacity: 0.8;
        letter-spacing: 1px;
      }
      #enemies-left {
        position: absolute;
        top: 12px;
        right: 14px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        padding: 7px 12px;
        font-size: 14px;
        color: #ffb0a8;
      }

      /* ---------- 击杀信息 ---------- */
      #killfeed {
        position: absolute;
        top: 52px;
        right: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-end;
      }
      .kf-item {
        background: rgba(0, 0, 0, 0.55);
        border-right: 3px solid var(--amber);
        padding: 4px 10px;
        font-size: 13px;
        transition: opacity 0.7s;
      }
      .kf-item .hs {
        color: #ff4b3c;
        font-weight: 700;
      }
      .kf-item.fade {
        opacity: 0;
      }

      /* ---------- 雷达 & 金钱 ---------- */
      #radar {
        position: absolute;
        top: 12px;
        left: 14px;
        border-radius: 4px;
      }
      #money {
        position: absolute;
        top: 152px;
        left: 14px;
        font-size: 20px;
        font-weight: 700;
        color: #8ee87f;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        padding: 4px 12px;
      }

      /* ---------- 底部状态 ---------- */
      #vitals {
        position: absolute;
        left: 14px;
        bottom: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 240px;
      }
      #vitals .stat {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        padding: 6px 10px;
      }
      #vitals .ico {
        font-size: 13px;
        width: 30px;
        opacity: 0.9;
      }
      #vitals .bar {
        flex: 1;
        height: 8px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        overflow: hidden;
      }
      #hp-fill {
        height: 100%;
        width: 100%;
        background: #67e26b;
        transition: width 0.15s;
      }
      #armor-fill {
        height: 100%;
        width: 0%;
        background: #57a8ff;
        transition: width 0.15s;
      }
      #vitals .num {
        width: 34px;
        text-align: right;
        font-size: 17px;
        font-weight: 700;
      }

      #ammo {
        position: absolute;
        right: 14px;
        bottom: 14px;
        text-align: right;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        padding: 8px 14px;
        min-width: 150px;
      }
      #weapon-name {
        font-size: 13px;
        color: var(--amber);
        letter-spacing: 1px;
        margin-bottom: 2px;
      }
      #ammo-mag {
        font-size: 32px;
        font-weight: 800;
        line-height: 1;
      }
      #ammo-reserve {
        font-size: 16px;
        opacity: 0.75;
      }

      /* ---------- 横幅 & 提示 ---------- */
      #banner {
        position: absolute;
        top: 22%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
      }
      #banner.show {
        opacity: 1;
      }
      #banner-title {
        font-size: 44px;
        font-weight: 900;
        letter-spacing: 6px;
        color: var(--amber);
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
      }
      #banner.good #banner-title {
        color: #6cf08a;
      }
      #banner.bad #banner-title {
        color: #ff5140;
      }
      #banner-sub {
        margin-top: 6px;
        font-size: 16px;
        letter-spacing: 2px;
        text-shadow: 0 1px 6px #000;
      }
      #hint {
        position: absolute;
        bottom: 110px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 16px;
        font-size: 14px;
        border-radius: 3px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #hint.show {
        opacity: 1;
      }

      /* ---------- 购买菜单 ---------- */
      #buymenu {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 360px;
        background: rgba(6, 10, 8, 0.92);
        border: 1px solid var(--panel-border);
        padding: 18px 20px;
        pointer-events: none;
      }
      #buymenu h3 {
        color: var(--amber);
        letter-spacing: 3px;
        margin-bottom: 4px;
        font-size: 18px;
      }
      #buy-money {
        font-size: 13px;
        color: #8ee87f;
        margin-bottom: 12px;
      }
      .buy-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        font-size: 15px;
      }
      .buy-item .key {
        width: 22px;
        height: 22px;
        background: var(--amber);
        color: #1a1408;
        font-weight: 800;
        text-align: center;
        line-height: 22px;
        border-radius: 3px;
        font-size: 13px;
      }
      .buy-item .bname {
        flex: 1;
      }
      .buy-item .price {
        color: #8ee87f;
        font-weight: 600;
      }
      .buy-item.poor {
        opacity: 0.42;
      }
      .buy-item.poor .price {
        color: #e25549;
      }
      .buy-item.owned .bname::after {
        content: " ✓ 已装备";
        color: #6cf08a;
        font-size: 12px;
      }
      #buymenu .close-tip {
        margin-top: 12px;
        font-size: 12px;
        opacity: 0.65;
        text-align: center;
      }

      /* ---------- 全屏菜单 ---------- */
      .overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(ellipse at center, rgba(24, 28, 20, 0.88), rgba(5, 7, 5, 0.96));
        text-align: center;
      }
      .overlay.hidden,
      .hidden {
        display: none !important;
      }
      .overlay h1 {
        font-size: 52px;
        letter-spacing: 10px;
        color: var(--amber);
        text-shadow: 0 0 30px rgba(240, 182, 74, 0.35);
      }
      .overlay h1 span {
        display: block;
        font-size: 15px;
        letter-spacing: 14px;
        color: #9aa08c;
        margin-top: 6px;
        font-weight: 400;
      }
      .overlay h2 {
        font-size: 34px;
        letter-spacing: 6px;
        color: var(--amber);
      }
      .overlay p {
        color: #b9beac;
        font-size: 15px;
        letter-spacing: 2px;
      }
      .overlay button {
        pointer-events: auto;
        cursor: pointer;
        font-family: inherit;
        font-size: 18px;
        letter-spacing: 4px;
        font-weight: 700;
        color: #1a1408;
        background: linear-gradient(180deg, #ffd257, #e8a938);
        border: none;
        padding: 13px 58px;
        border-radius: 3px;
        margin-top: 8px;
        transition: transform 0.08s, box-shadow 0.2s;
      }
      .overlay button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(240, 182, 74, 0.4);
      }
      .overlay button.secondary {
        background: transparent;
        color: #cfd4c2;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .overlay .help {
        margin-top: 22px;
        font-size: 13px;
        color: #8d937f;
        line-height: 2;
        max-width: 620px;
      }
      .overlay .help b {
        color: #d8dcc8;
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 7px;
        border-radius: 3px;
        margin: 0 2px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud">
      <div id="damage-vignette"></div>
      <div id="scope">
        <div class="mask"></div>
        <div class="lineh"></div>
        <div class="linev"></div>
      </div>
      <div id="crosshair">
        <span class="line t"></span><span class="line b"></span><span class="line l"></span
        ><span class="line r"></span><span class="dot"></span>
      </div>
      <div id="hitmarker"><span></span><span></span><span></span><span></span></div>

      <div id="topbar">
        <div class="cell" id="score-ct">0</div>
        <div class="cell mid">
          <div id="round-timer">1:55</div>
          <div id="round-num">第 1 回合</div>
        </div>
        <div class="cell" id="score-t">0</div>
      </div>
      <div id="enemies-left">存活敌人 0</div>
      <div id="killfeed"></div>

      <canvas id="radar" width="176" height="132"></canvas>
      <div id="money">$ 800</div>

      <div id="vitals">
        <div class="stat">
          <span class="ico">生命</span>
          <div class="bar"><div id="hp-fill"></div></div>
          <span class="num" id="hp-num">100</span>
        </div>
        <div class="stat">
          <span class="ico">护甲</span>
          <div class="bar"><div id="armor-fill"></div></div>
          <span class="num" id="armor-num">0</span>
        </div>
      </div>

      <div id="ammo">
        <div id="weapon-name">USP 手枪</div>
        <div><span id="ammo-mag">12</span> <span id="ammo-reserve">/ 36</span></div>
      </div>

      <div id="banner">
        <div id="banner-title"></div>
        <div id="banner-sub"></div>
      </div>
      <div id="hint"></div>

      <div id="buymenu" class="hidden">
        <h3>购买装备</h3>
        <div id="buy-money">资金 $ 800</div>
        <div id="buy-list"></div>
        <div class="close-tip">按数字键购买 · 按 B 关闭</div>
      </div>
    </div>

    <div id="menu" class="overlay">
      <h1>沙漠突袭<span>DUST STRIKE</span></h1>
      <p>类 CS 第一人称射击 · 消灭全部敌人赢得回合</p>
      <button id="btn-start">开 始 游 戏</button>
      <div class="help">
        <b>W A S D</b> 移动 · <b>鼠标</b> 视角/射击 · <b>右键</b> 瞄准 · <b>R</b> 换弹 · <b>B</b> 购买装备<br />
        <b>1 / 2 / 3</b> 切换武器 · <b>Shift</b> 静步 · <b>Ctrl</b> 蹲下 · <b>空格</b> 跳跃 · <b>方向键</b> 也可转视角
      </div>
    </div>

    <div id="pause" class="overlay hidden">
      <h2>游戏暂停</h2>
      <p>指针已解锁 · 点击下方按钮继续战斗</p>
      <button id="btn-resume">继 续 游 戏</button>
      <button id="btn-restart" class="secondary">重 新 开 始</button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
